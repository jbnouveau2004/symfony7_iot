# config/packages/nelmio_cors.yaml

nelmio_cors:
    defaults:
        allow_credentials: false
        allow_origin:
            - 'http://localhost:8000'
            - 'http://localhost:8100'
        allow_headers:
            - 'Content-Type'
            - 'Authorization'
            - 'X-Requested-With'
        allow_methods:
            - 'GET'
            - 'POST'
            - 'PUT'
            - 'DELETE'
            - 'OPTIONS'
        max_age: 3600

    paths:
        '^/':
            allow_origin:
                - 'http://localhost:8000'
                - 'http://localhost:8100'
            allow_headers:
                - 'Content-Type'
                - 'Authorization'
                - 'X-Requested-With'
            allow_methods:
                - 'GET'
                - 'POST'
                - 'PUT'
                - 'DELETE'
                - 'OPTIONS'
            max_age: 3600